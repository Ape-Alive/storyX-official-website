# 推送 prod-cn：部署官网到国内服务器（Environment: production-cn）
name: Deploy Production CN

on:
  push:
    branches:
      - prod-cn
  workflow_dispatch:

concurrency:
  group: deploy-prod-cn-official
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-cn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build:prod

      - name: Prepare release package
        run: |
          mkdir -p release/dist
          cp -R dist/. release/dist/
          cp deploy/remote-deploy.sh release/remote-deploy.sh
          chmod +x release/remote-deploy.sh

      - name: Check deploy secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::缺少 Environment Secret: SSH_PRIVATE_KEY（production-cn）"
            exit 1
          fi
          if [ -z "$SSH_HOST" ]; then
            echo "::error::缺少 Environment Secret: SSH_HOST（例如 43.142.48.254）"
            exit 1
          fi
          if [ -z "$SSH_USER" ]; then
            echo "::error::缺少 Environment Secret: SSH_USER（应为 deploy）"
            exit 1
          fi

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload release to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          PORT="${SSH_PORT:-22}"
          DEST="${DEPLOY_PATH:-/opt/storyx-official-website}"
          ssh -p "$PORT" "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEST}/release' '${DEST}/dist'"
          rsync -az --delete \
            -e "ssh -p ${PORT}" \
            release/ \
            "${SSH_USER}@${SSH_HOST}:${DEST}/release/"

      - name: Run remote deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          PORT="${SSH_PORT:-22}"
          DEST="${DEPLOY_PATH:-/opt/storyx-official-website}"
          ssh -p "$PORT" "${SSH_USER}@${SSH_HOST}" \
            "DEPLOY_PATH='${DEST}' bash '${DEST}/release/remote-deploy.sh'"
