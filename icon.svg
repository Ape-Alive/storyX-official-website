<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
    <!-- [1] iOS Background Gradient -->
    <linearGradient id="bg_grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0C1E36"/>
        <stop offset="100%" stop-color="#050E1A"/>
    </linearGradient>

    <!-- [2] Dynamic 3D Radial Colors for Core Shape -->
    <radialGradient id="fire_3d_grad" cx="50%" cy="65%" r="60%" fx="50%" fy="60%">
        <stop offset="0%" stop-color="#E0F2FE"/>
        <stop offset="25%" stop-color="#38BDF8"/>
        <stop offset="50%" stop-color="#0284C7"/>
        <stop offset="85%" stop-color="#F472B6"/>
        <stop offset="100%" stop-color="#4C1D95"/>
    </radialGradient>

    <!-- [3] Core Shape Inner Glow -->
    <filter id="inner_glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="out" result="glow"/>
        <feFlood flood-color="#0284C7" flood-opacity="0.75" result="color"/>
        <feComposite in="color" in2="glow" operator="in"/>
        <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <!-- [4] Shadow Filter -->
    <filter id="main_shadow" x="-30%" y="-20%" width="160%" height="160%">
        <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#4C1D95" flood-opacity="0.3"/>
    </filter>

    <!-- [5] Glossy Glaze Overlay Gradient -->
    <linearGradient id="glaze_grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- [6] AI Particles Gradients -->
    <radialGradient id="ai_particle_grad_1">
        <stop offset="10%" stop-color="#FFFFFF"/>
        <stop offset="60%" stop-color="#38BDF8"/>
        <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ai_particle_grad_2">
        <stop offset="10%" stop-color="#FFFFFF"/>
        <stop offset="60%" stop-color="#F472B6"/>
        <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ai_particle_grad_3">
        <stop offset="10%" stop-color="#FFFFFF"/>
        <stop offset="60%" stop-color="#A78BFA"/>
        <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>

    <!-- [7] Background Particles Blur Filter -->
    <filter id="particle_blur" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="5"/>
    </filter>
</defs>

<!-- Layer 1: App Base Frame (iOS Rounded Rect) -->
<rect width="1024" height="1024" rx="230" fill="url(#bg_grad)"/>

<!-- Layer 2: Ambient Background Particles (Blurred & Animated, only if enabled) -->


<!-- Layer 3: Central 3D High-Tech Vector Shape with Glow & Shadows -->
<g transform="translate(512 512) scale(0.72) translate(-512 -512)" filter="url(#main_shadow)">
